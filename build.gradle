plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Nebulon (lights, rune circles, flat shapes)
	maven { url = 'https://maven.riftrealms.de/releases' }
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"leyline" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "de.nexusrealms:nebulon:${project.nebulon_version}"
}

processResources {
	def props = [
		version           : project.version,
		loader_version    : project.loader_version,
		// Minimum versions are the ones we build against.
		fabric_api_version: project.fabric_api_version,
		// Nebulon is a 0.x beta, so `~` also rejects its next minor release, which may break the API.
		nebulon_version   : project.nebulon_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:deprecation']
}

java {
	// Loom attaches the sources JAR to the build task.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Mods build against Leyline from a Maven repository: `gradlew publishToMavenLocal` puts it in the local one.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = 'leyline'
			from components.java
		}
	}
}
