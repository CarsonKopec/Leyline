plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}"
}

repositories {
	// Nebulon (lights, rune circles, flat shapes)
	maven { url = 'https://maven.riftrealms.de/releases' }
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"leyline" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "de.nexusrealms:nebulon:${project.nebulon_version}"
}

processResources {
	def props = [
		version           : project.version,
		loader_version    : project.loader_version,
		// Minimum versions are the ones we build against.
		fabric_api_version: project.fabric_api_version,
		// Nebulon is a 0.x beta, so `~` also rejects its next minor release, which may break the API.
		nebulon_version   : project.nebulon_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:deprecation']
}

java {
	// Loom attaches the sources JAR to the build task.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Mods build against Leyline from a Maven repository: `gradlew publishToMavenLocal` puts it in the local one.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = 'leyline'
			from components.java
		}
	}
}

// Uploads the release to Modrinth and CurseForge: `gradlew publishMods`, with MODRINTH_TOKEN and CURSEFORGE_TOKEN set
// (see docs/releasing.md). Without both it's a dry run, which only writes what it would upload to build/publishMods.
publishMods {
	def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN')
	def curseforgeToken = providers.environmentVariable('CURSEFORGE_TOKEN')
	dryRun = !modrinthToken.isPresent() || !curseforgeToken.isPresent()

	file = remapJar.archiveFile
	displayName = "Leyline ${project.version}"
	// 0.x, on a beta Nebulon.
	type = BETA
	modLoaders.add('fabric')
	// This version's section of CHANGELOG.md, without its heading. Publishing fails if there isn't one.
	def releaseVersion = project.version.toString()
	changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
		def section = text.split(/(?m)^## /).find { it.startsWith(releaseVersion + ' ') || it.startsWith(releaseVersion + '\n') }
		if (section == null) {
			throw new GradleException("CHANGELOG.md has no section for ${releaseVersion}")
		}
		section.substring(section.indexOf('\n') + 1).trim()
	}

	modrinth {
		projectId = project.modrinth_project_id
		accessToken = modrinthToken
		minecraftVersions.add(project.minecraft_version)
		additionalFile(remapSourcesJar) {
			type = SOURCES_JAR
		}
		// Nebulon is required too, but is on neither site (see docs/releasing.md).
		requires('fabric-api')
	}

	curseforge {
		projectId = project.curseforge_project_id
		accessToken = curseforgeToken
		minecraftVersions.add(project.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_21)
		client = true
		server = true
		requires('fabric-api')
	}
}
